<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You for Your Order!</title>
  <link rel="stylesheet" href="Style.css">
  <style>
    /* Background Gradient */
    body {
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: #333;
      text-align: center;
      overflow: hidden;
    }

    /* Animasi smooth untuk konten */
    .success-content {
      opacity: 0;
      animation: fadeIn 1s forwards, floatUp 1.5s ease-in-out forwards;
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes floatUp {
      0% { transform: translateY(20px); }
      100% { transform: translateY(0); }
    }

    /* Styling halaman sukses */
    .thank-you-message {
      font-size: 36px;
      font-weight: 600;
      color: #7a4700;
      margin-top: 50px;
    }

    .thank-you-subtext {
      font-size: 20px;
      margin-top: 20px;
      color: #7a4700;
      opacity: 0;
      animation: fadeIn 2s 0.5s ease-in-out forwards;
    }

    .back-home-btn {
      padding: 12px 25px;
      background: #7a4700;
      color: #ffffff;
      border: none;
      border-radius: 25px;
      font-size: 18px;
      cursor: pointer;
      text-decoration: none;
      margin-top: 30px;
      display: inline-block;
      opacity: 0;
      animation: fadeIn 2s 1s ease-in-out forwards, pulse 1.5s infinite alternate;
    }

    .back-home-btn:hover {
      background: #7a4700;
      transform: scale(1.1);
    }

    /* Animasi Pulse untuk efek tombol */
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Success Content -->
  <div class="success-content">
    <div class="thank-you-message">
      Thank You for Your Order! 🎉
    </div>
    <div class="thank-you-subtext">
      Your order is being processed. We will notify you once it's on the way! 💌
    </div>
    <a href="Beranda.html" class="back-home-btn">Back to Home</a>
  </div>

  <script>
    // Menampilkan konten sukses setelah beberapa detik
    setTimeout(function() {
      document.querySelector('.success-content').style.opacity = 1;  // Tampilkan konten sukses
    }, 500); // Waktu delay 0.5 detik untuk memberi efek
  </script>

</body>
</html>
